name: Bug
description: 某条路径坏了
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      placeholder: 1. hyper web … 2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hyper --version / commit
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS / Windows / Linux
