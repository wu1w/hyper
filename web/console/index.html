<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grok-hyper</title>
    <script>
      if (/\bElectron\b/.test(navigator.userAgent)) {
        const html = document.documentElement;
        html.classList.add("electron");
        if (/Windows/i.test(navigator.userAgent)) html.classList.add("win");
        else if (/Mac/i.test(navigator.userAgent)) html.classList.add("mac");
      }
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
